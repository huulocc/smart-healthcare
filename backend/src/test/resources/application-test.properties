# Tests use an in-memory H2 database, so they run without a SQL Server instance.
#
# MODE names the database H2 should imitate, so it follows the application: MySQL before
# the port, MSSQLServer after it. It is a compatibility layer, not a dialect -- Hibernate
# still sees an H2 connection and uses H2Dialect either way -- so what this buys is that a
# query which only works because of MySQL's grammar fails here too, instead of passing in
# the tests and failing in front of SQL Server.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

app.jwt.secret=test-only-jwt-secret-with-at-least-32-bytes
app.jwt.remember-me-expiration-seconds=2592000
app.frontend-url=http://localhost:5173
spring.mail.username=

# The migrations are SQL Server-specific and still cannot run on H2 -- more so than before,
# in fact: IDENTITY(1,1), datetimeoffset, bracket-quoted identifiers, FORMAT(id, 'D5') and,
# in V6, a lookup through sys.default_constraints. H2's MSSQLServer mode imitates the
# grammar, not the catalog views. Tests build the schema from the entities instead and keep
# running without a database installed. The migrations are checked another way: against
# SQL Server, where ddl-auto=validate compares them to these same entities on every
# start-up. Do not "fix" this by turning validate off -- that pairing is the only thing
# covering the migrations.
spring.flyway.enabled=false

# application.properties imports file:.env and Maven runs tests with the working directory
# at backend/, so a developer's real .env is visible here. Pin the admin bootstrap inert.
app.admin.email=

# Telemetry secret is blank by default in tests so existing tests without secret headers pass
app.ai.telemetry-secret=

# Google Cloud properties pinned blank in tests to prevent developer .env leakage
google.cloud.project-id=
google.cloud.credentials-path=
google.cloud.oauth-access-token=
google.cloud.billing-project-id=
google.cloud.billing-dataset=
google.cloud.billing-table=

