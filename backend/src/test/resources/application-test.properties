# Tests use an in-memory H2 database, so they run without Docker or MySQL.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

app.jwt.secret=test-only-jwt-secret-with-at-least-32-bytes
app.jwt.remember-me-expiration-seconds=2592000
app.frontend-url=http://localhost:5173
spring.mail.username=

# The migrations are MySQL-specific (native enum columns, InnoDB, utf8mb4), so they cannot
# run on H2. Tests build the schema from the entities instead and keep running without
# Docker. The migrations are checked another way: against MySQL, where ddl-auto=validate
# compares them to these same entities on every start-up. Do not "fix" this by turning
# validate off -- that pairing is the only thing covering the migrations.
spring.flyway.enabled=false
