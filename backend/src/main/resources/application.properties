spring.application.name=backend

# Local secrets live in backend/.env (never committed). See backend/.env.example.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# Database: MySQL started with docker-compose.yml at the repo root
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_healthcare}
spring.datasource.username=${DB_USERNAME:healthcare}
spring.datasource.password=${DB_PASSWORD:healthcare}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Gmail SMTP for password reset emails
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Fail fast instead of hanging the request if Gmail is unreachable
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Application settings
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=3600
# "Keep me logged in for 30 days" on the login page
app.jwt.remember-me-expiration-seconds=2592000
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# OAuth client ID from Google Cloud Console. Empty = the Google button is turned off.
app.google.client-id=${GOOGLE_CLIENT_ID:}
