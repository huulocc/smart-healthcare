spring.application.name=backend

# Local secrets live in backend/.env (never committed). See backend/.env.example.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# Database: SQL Server on the developer's own machine. See backend/.env.example for how to
# reach it -- a local instance needs TCP/IP switched on before any of this works.
#
# One DB_URL rather than the DB_HOST/DB_PORT/DB_NAME pieces this used to assemble: SQL
# Server addresses a named instance by instance name and a default instance by port, and
# those two shapes do not fit one template. The default below is the static-port shape.
#
# encrypt=true;trustServerCertificate=true is not optional padding. The driver has
# encrypted connections by default since version 10, and a local instance presents a
# self-signed certificate that nothing on the machine trusts, so without the second half
# the handshake fails. It says "trust whatever this server offers", which is fine for a
# developer database and wrong for anything reachable from another machine.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=SmartHealthcareDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:healthcare}
spring.datasource.password=${DB_PASSWORD:healthcare}
# The schema is owned by src/main/resources/db/migration, not by Hibernate. `validate`
# turns every start-up into a check that the migrations and the entities still agree.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# The team's SQL Server database already holds V1-V5: five departments, five demo doctors
# and their shifts, codes already aligned to ids, plus real registered accounts and tables
# belonging to work that has not been merged yet. Replaying the migrations on it is not an
# option and emptying it would destroy someone else's work, so Flyway records V1-V5 as the
# baseline and starts at V6, which closes the handful of differences between that database
# and what V1-V5 describe. An empty database runs V1-V6 in order and ends up identical --
# verified by diffing the two.
#
# The cost of baselining: a non-empty database that is NOT that one -- say a half-built
# experiment holding only V1's tables -- would also be marked as "V1-V5 already applied"
# and silently skip them. Drop such a database and let the migrations build it instead.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=5
spring.flyway.baseline-description=Schema restored from the team's SQL Server backup

# Gmail SMTP for password reset emails
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Fail fast instead of hanging the request if Gmail is unreachable
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Application settings
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=3600
# "Keep me logged in for 30 days" on the login page
app.jwt.remember-me-expiration-seconds=2592000
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# The first admin account, created once at start-up by AdminAccountBootstrap. There is no
# sign-up path for admins on purpose. Blank = no account is created. See backend/.env.example.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.full-name=${ADMIN_FULL_NAME:System Administrator}
app.admin.phone=${ADMIN_PHONE:0000000000}
# OAuth client ID from Google Cloud Console. Empty = the Google button is turned off.
app.google.client-id=${GOOGLE_CLIENT_ID:}
