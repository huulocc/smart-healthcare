spring.application.name=backend

# Local secrets live in backend/.env (never committed). See backend/.env.example.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

server.port=${SERVER_PORT:8080}

# Database: Microsoft SQL Server
spring.datasource.url=${DB_URL:jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:SmartHealthcareDB};encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Flyway is disabled because existing migrations are MySQL-specific and database already has schema
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema created by Hibernate ddl-auto=update

# Gmail SMTP for password reset emails
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Fail fast instead of hanging the request if Gmail is unreachable
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Application settings
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=3600
# "Keep me logged in for 30 days" on the login page
app.jwt.remember-me-expiration-seconds=2592000
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# The first admin account, created once at start-up by AdminAccountBootstrap. There is no
# sign-up path for admins on purpose. Blank = no account is created. See backend/.env.example.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.full-name=${ADMIN_FULL_NAME:System Administrator}
app.admin.phone=${ADMIN_PHONE:0000000000}
# OAuth client ID from Google Cloud Console. Empty = the Google button is turned off.
app.google.client-id=${GOOGLE_CLIENT_ID:}
